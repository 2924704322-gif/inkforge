# 模型接入配置（可在工具页「Agent 模型配置」面板查看/修改）
# providers 定义接入点；roles 将 Agent 角色绑定到 接入点/模型/参数。
# api_key 推荐使用 ${ENV_VAR} 占位符从环境变量（.env）读取，不落明文。
#
# ⚠ 模型名与别名的实测教训（2026-09-22 记录，2026-10-03 复核后仍然有效）：
#   官方端点上的 `deepseek-chat` / `deepseek-reasoner` **已被改道到 `deepseek-flash`**
#   ——实测请求 deepseek-chat 返回的 `model` 字段就是 deepseek-flash；
#   该别名亦已被官方停用并迁移到 V4 Flash/Pro。
#   因此**写别名 = 配置一个字没动、线上行为却变了**：09-21 那次"拒答从 0 到暴增"
#   就是绑定切换叠加模型换代的结果（详见 docs/13 §8.1）。
#
# ⚠ 当前绑定（2026-10-03 全量对齐决策）：
#   全部 12 个角色 = `deepseek / deepseek-chat`，**与原版（inkforge-test）字面一致**。
#   决策依据：审计得出"原版防拒绝成功率与容忍度更高"的三条成因中，本次只修其中两条
#   （重试提示词不再回写判据关键词、结构化失败不再提前收敛）；模型绑定按作者要求改回
#   别名以保持与原版字面一致。
#   ——**知悉风险**：由于 `deepseek-chat` 已被改道，该绑定实际仍会解析到 flash 后端，
#   这一项**不产生行为回退**，仅恢复配置字面。真正要不要换回更强的显式模型（如
#   `deepseek-v4-pro`）是产品决策，需另行拍板。
#
#   三臂实测结论（2026-09-22 三臂对照，数据见 docs/13 §8–§9，供换模型时参考）：
#   - `official-flash`（官方 deepseek/deepseek-flash）：writer p50 62.2s、出卡 JSON p50 44.5s，稳定，无网关单点依赖。
#   - `gateway-flash`（网关 opencode-go/deepseek-flash，同模型名）：writer p50 40.8s、出卡 p50 31.5s，更快，但多一层外部网关依赖，
#     仅作为"想提速时的可选轮换臂"（注意网关 headers 会随请求发出，见 providers.opencode-go）。
#   - `gateway-v4-flash`（网关 opencode-go/deepseek-v4-flash）：出卡 JSON p50 **206.1s（最长 285.6s）**，会把"变慢"放大 4~6 倍。
#     但真实作品上下文对照里它是三臂中**唯一 2/2 稳定成功**（0 结构化失败 / 0 拒答 / 调用数最少），代价是墙钟约 2 倍；n=2 不足以拍板。
#   改动本文件的绑定前：先 `Copy-Item models.yaml models.yaml.bak-<时间戳>`（本文件承载多批次未提交改动，
#   **不要** `git checkout` 它），并注意"改绑定必须重启 Inkforge 才生效"。

providers:
  deepseek:
    type: openai_compat
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
  opencode-go:
    type: openai_compat
    api_key: ${OPENCODE_API_KEY}
    base_url: https://opencode.ai/zen/go/v1
    headers:
      x-opencode-session: inkforge-novel-agent-01
      User-Agent: inkforge/0.1
# roles 段绑定：2026-10-03 全量对齐决策后 = 官方 deepseek/deepseek-chat（与原版字面一致；见文件头"当前绑定"）。
roles:
  architect:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
    # max_tokens 8000 → 16000（2026-09-22 真机报错日志排障，engine/data/runtime/logs/desktop-20260921.log）：
    #   8000 时"出卡 / 设定"这类结构化调用会返回**空内容**——`chat_structured` 拿到空串后
    #   `json.loads("")` 报 `Expecting value: line 1 column 1 (char 0)`（日志里 34 次），
    #   3 次解析重试 + 4 轮保真链重试全部撞同一堵墙，最终 `Plotter 只产出了 0 张剧情卡`。
    #   实测签名与 writer 一致：输出预算被推理吃光、content 为空（见 writer 段实测数据）。
    #   注意：剧情卡（Plotter）复用本绑定（plotter.ROLE = "architect"），改这里即同时修出卡。
    max_tokens: 16000
  writer:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.7
    # max_tokens 8000 → 16000（2026-09-22 真机冒烟实测，engine/smoke_refusal_baseline.py）：
    #   8000 时"5000 字目标"的产出 50~67% 被截断（finish_reason=length），正文只落
    #   242~4708 字，并偶发"输出预算被推理吃光 → 空产出"（completion_tokens=8000 而
    #   content 为空，触发保真链重试、最坏抛 BriefFidelityError）；
    #   16000 实测 3/3 完成（正文 5175/6482/7638 字，finish_reason=stop，0 截断 0 空产出）。
    # 接入点实测接受 max_tokens 至 32000（api.deepseek.com/v1, deepseek-flash）。
    # 温度**不动**：同批次 A/B 未发现温度对空产出/截断有可判定影响（见 docs 报告）。
    max_tokens: 16000
  editor:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.0
    # 显式给足输出预算（2026-09-22）：此前**不写** max_tokens，于是走接入点默认值——
    # 而审校/摘要同样是"长 prompt + 结构化 JSON"，与 architect 出卡同一失败机理
    # （预算被推理吃光 → content 为空 → json.loads("") 报 char 0）。此处按同一口径给 16000。
    max_tokens: 16000
  master:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  character:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  plot:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  outline:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  prose:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.7
    max_tokens: 8000
  review:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.2
  constraint:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.4
  # 正文改写（创作功能第四项，2026-10-04 新增）：
  #   整篇回传意味着**输出 ≈ 原文字数**——15000 字上限的原文最坏产出约 20000 字 ≈ 30000 token，
  #   故 max_tokens 取接入点实测可接受的 32000（否则会被 length 截断，段级对齐直接失效）。
  #   温度 0.6：比 prose(0.7) 冷静一点——这个模块的价值在"少改"，不在"文采"。
  revision:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.6
    max_tokens: 32000
  chat:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  distiller:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.3
embedding:
  type: openai_compat
  base_url: https://api.siliconflow.cn/v1
  api_key: ${EMBEDDING_API_KEY}
  model: BAAI/bge-m3
