# 模型接入配置（D3：自主接入）
# providers 定义接入点；roles 将 Agent 角色绑定到 接入点/模型/参数。
# api_key 使用 ${ENV_VAR} 占位符从环境变量读取，不落盘。
# 更换厂商/模型只改本文件，代码零改动。

providers:
  deepseek:
    type: openai_compat
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
  # my-claude:
  #   type: anthropic
  #   api_key: ${ANTHROPIC_API_KEY}
  # local-ollama:
  #   type: openai_compat
  #   base_url: http://localhost:11434/v1
  #   api_key: none

# 关于 max_tokens（**长正文字数的硬上限，务必显式设置**）：
#   不写 max_tokens 时 DeepSeek 兼容端点按自己的默认值截断（通常 4096），
#   折算成中文正文只有约 3000-4000 字 —— 于是"要求 5000 字"从**第一次调用**就
#   被物理截断，无论提示词怎么写都到不了目标（用户实测"实际输出远小于要求"的直接原因）。
#   deepseek-chat 单次输出上限是 8192，故正文类角色统一给足 8000；
#   结构化短输出（审校评分 / 约束提炼）保持默认，避免浪费。
roles:
  # orchestrator 角色已移除：v1.0 采用 LangGraph 固定状态图编排（graph.py），
  # 无 LLM 意图路由需求；如未来引入自由对话入口再恢复此绑定。
  #
  # fallback 查因结论（W10 / E3）：全 11 个角色均未启用 fallback。
  #   关闭原因**不是** provider 不支持、也**不是** schema 未接：FallbackBinding、
  #   ModelRegistry.chat_as 的降级链路、probe_all 的降级探活（只告警不阻断）都已完整
  #   实现，used_fallback 也已写入章节 frontmatter 并透出到 UI。唯一原因是本文件当前
  #   只定义了一个可用接入点（deepseek），而 ModelsConfig._validate_bindings 要求
  #   fallback.provider 必须已在 providers 中定义——指向未定义接入点会在加载期直接
  #   Fail-Fast（原 architect 段下的 my-claude 示例正是这种情况：其 provider 条目同样
  #   处于注释状态）。故本版**决定暂不启用**：不启用不会改变任何现有行为，贸然启用才会
  #   在启动期失败。待存在第二个真实接入点时，取消 providers 段相应条目的注释并为各角色
  #   补上 fallback 段即可，代码零改动。
  # 附带确认（纯静态可查，不再作为待确认项）：章节审查走 `editor` 角色
  #   （Editor.ROLE = "editor"，Summarizer 复用同一绑定）；`review` 角色只服务工作台
  #   的「审校主编」子智能体，不参与章节审查。
  architect:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
    max_tokens: 8000    # 全书大纲 + 逐章字数预算：几十章的大纲一次输出，4k 会截断
    # 可选：降级接入点（主接入点调用失败时自动切换，需在 providers 中定义该点）
    # fallback:
    #   provider: my-claude
    #   model: claude-3-5-sonnet-20241022
  writer:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.7
    max_tokens: 8000    # ★ 章节正文：必须给足，否则单次产出被截断在 3000-4000 字
  editor:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.0

  # 对话智能体（Inkforge 工作台：主智能体 + 五个子智能体 + 风格工坊约束提炼，各自可绑不同模型）
  master:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  character:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  plot:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  outline:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8
  prose:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.7
    max_tokens: 8000    # 子智能体的正文类产出：与 writer 同等上限
  review:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.2
  # 风格工坊「约束提炼」智能体：把作者口述的要求提取成自定义创作约束。
  # 温度取低（0.4）= 要的是忠实提取，不是发挥；接入点仍可由此处改绑任意 provider。
  constraint:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.4
  # 兼容旧会话的通用对话角色
  chat:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.8

  # 蒸馏角色（NDS: 小说蒸馏系统；复用 deepseek 接入点，低温度保证结构化输出一致）
  distiller:
    provider: deepseek
    model: deepseek-chat
    temperature: 0.3

# Embedding 配置
# type 可选：
#   chroma_default —— ChromaDB 内置 ONNX 模型（零依赖，英文优；开发调试用）
#   openai_compat  —— 任意 OpenAI 兼容 embedding API（如硅基流动 BAAI/bge-m3）
#   local_bge      —— 本地 BGE-M3（需 pip install FlagEmbedding）
#
# 默认档：硅基流动 BGE-M3（中文优化，正式生产推荐）。
# 需在 .env 配置 EMBEDDING_API_KEY=<硅基流动 API Key>。
# 切换 embedding 模型后须执行 rebuild-index 全量重建向量索引（identity 变化）。
embedding:
  type: openai_compat
  base_url: https://api.siliconflow.cn/v1
  api_key: ${EMBEDDING_API_KEY}
  model: BAAI/bge-m3
  # 零依赖开发档（ChromaDB 内置 ONNX MiniLM，英文优）：
  # type: chroma_default
  # 本地推理档（需 pip install FlagEmbedding，首次下载约 2GB）：
  # type: local_bge
  # model: BAAI/bge-m3

