[project]
name = "inkforge-engine"
version = "0.2.0"
description = "Inkforge 长篇小说智能创作工作台 —— Python 引擎 sidecar"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "markdown>=3.6",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.60",
    "anthropic>=0.40",
    "chromadb>=1.0",
    "rank_bm25>=0.2.2",
    "jieba>=0.42",
    "python-frontmatter>=1.1",
    "GitPython>=3.1",
    "PyYAML>=6.0",
    "ebooklib>=0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools]
packages = ["src"]

# ─────────────── 测试 ───────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore:.*pkg_resources.*:UserWarning",
    "ignore::DeprecationWarning:jieba.*",
]
markers = [
    "llm: 需要真实 LLM 调用的测试（默认跳过，显式 -m llm 运行）",
]

# ─────────────── Lint / Format ───────────────

[tool.ruff]
line-length = 110
target-version = "py312"
# 引擎 web 层为蒸馏遗留的大函数文件，暂时放宽复杂度告警
extend-exclude = ["data", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # 行长由 formatter 处理
    "B008",    # FastAPI Depends() 默认参数是惯用写法
    "SIM108",  # 三元表达式不强制

    # ── 存量基线（2026-09-14 首次接入 ruff 时的既有告警，刻意暂缓）──
    # 这些规则本身合理，但涉及对「已验收的生成代码」做大规模无行为变更改写，
    # 收益（可读性）低于风险（改动面 40+ 处、diff 淹没真实变更）。
    # 策略：新代码不再引入；存量在后续按模块重构时顺带收敛。
    "B904",    # 41 处 raise-without-from：逐处补 `from e` 会改动异常链语义
    "SIM102",  # 3 处可折叠 if
    "C408",    # 2 处 dict() 调用字面量
    "B905",    # 2 处 zip() 未显式 strict
    "B027",    # 1 处空方法未加 abstractmethod（Skill.handle_event 的默认 no-op 是有意的）
    "UP007",   # 1 处 Union 注解
    "UP047",   # 1 处泛型函数写法
    "UP036",   # 1 处版本分支
    "SIM105",  # 1 处 contextlib.suppress
    "B007",    # 1 处未使用循环变量
]

[tool.ruff.lint.per-file-ignores]
# 蒸馏遗留的巨型 web 模块：允许局部导入与较长函数，逐步收敛
"src/web/*.py" = ["E402", "C901", "PLR0912", "PLR0915"]
"tests/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ─────────────── 类型检查（渐进式：只对新增/已收敛模块开启） ───────────────

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
# 存量代码未做类型收敛，先只检查新增模块；后续逐目录放开
files = ["src/web/auth.py", "src/memory/store_factory.py"]
